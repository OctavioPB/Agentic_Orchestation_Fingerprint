[tool.ruff]
line-length = 100
target-version = "py311"
src = ["services", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "N999",   # module name not lowercase (workspace scripts are intentionally named for candidates)
]

[tool.ruff.lint.isort]
known-first-party = ["services"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--tb=short -v"
