name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main]

jobs:

  lint-python:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff==0.4.4
      - name: Check style
        run: ruff check services/ tests/
      - name: Check formatting
        run: ruff format --check services/ tests/

  lint-typescript:
    name: TypeScript lint (tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Skip if no dashboard yet
        run: |
          if [ -d "services/dashboard" ]; then
            cd services/dashboard
            npm ci
            npx tsc --noEmit
          else
            echo "services/dashboard not yet created — skipping tsc"
          fi

  unit-tests:
    name: Unit tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: pip install pytest pydantic>=2.0
      - name: Run unit tests
        run: pytest tests/unit/ -v --tb=short
        # Integration tests (tests/integration/) require Docker + testcontainers
        # and are NOT run in this job. Run them locally with:
        #   pytest tests/integration/ -m integration -v

  docker-build:
    name: Docker build check (sandbox)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build sandbox image
        uses: docker/build-push-action@v5
        with:
          context: ./services/sandbox
          file: ./services/sandbox/Dockerfile
          push: false
          tags: orchid-sandbox:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
